[profile.default]

# See more config options https://github.com/foundry-rs/foundry/tree/master/config

solc = "0.8.25"
optimizer = true
optimizer_runs = 100000
evm_version = "cancun"

# Solc's default metadata trailer hashes the source files, so the pin would track prose, not code.
bytecode_hash = "none"
cbor_metadata = false

fs_permissions = [{ access = "read", path = "./audit" }]

libs = ["dependencies"]

fuzz.runs = 1024

[dependencies]
forge-std = "1.16.1"

[soldeer]
recursive_deps = false

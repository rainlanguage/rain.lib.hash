# ---------------- combineHashes ----------------

[[mutants]]
name = "CH01 combineHashes writes the operands in the other order"
file = "src/lib/LibHashNoAlloc.sol"
target = '''mstore(0, a)
            mstore(0x20, b)'''
replacement = '''mstore(0, b)
            mstore(0x20, a)'''

[[mutants]]
name = "CH02 combineHashes hashes only the first scratch word"
file = "src/lib/LibHashNoAlloc.sol"
target = "hash := keccak256(0, 0x40)"
replacement = "hash := keccak256(0, 0x20)"

[[mutants]]
name = "CH03 combineHashes hashes from the second scratch word"
file = "src/lib/LibHashNoAlloc.sol"
target = "hash := keccak256(0, 0x40)"
replacement = "hash := keccak256(0x20, 0x40)"

[[mutants]]
name = "CH04 combineHashes hashes past scratch into the free memory pointer"
file = "src/lib/LibHashNoAlloc.sol"
target = "hash := keccak256(0, 0x40)"
replacement = "hash := keccak256(0, 0x60)"

[[mutants]]
name = "CH05 combineHashes drops the second operand"
file = "src/lib/LibHashNoAlloc.sol"
target = "mstore(0x20, b)"
replacement = "mstore(0x20, a)"

[[mutants]]
name = "CH06 combineHashes hashes through a fresh allocation instead of scratch"
file = "src/lib/LibHashNoAlloc.sol"
target = '''mstore(0, a)
            mstore(0x20, b)
            hash := keccak256(0, 0x40)'''
replacement = '''let free := mload(0x40)
            mstore(free, a)
            mstore(add(free, 0x20), b)
            mstore(0x40, add(free, 0x40))
            hash := keccak256(free, 0x40)'''

# ---------------- HASH_NIL ----------------

[[mutants]]
name = "HN01 HASH_NIL is off by one nibble"
file = "src/lib/LibHashNoAlloc.sol"
target = "bytes32 constant HASH_NIL = 0xc5d2460186f7233c927e7db2dcc703c0e500b653ca82273b7bfad8045d85a470;"
replacement = "bytes32 constant HASH_NIL = 0xc5d2460186f7233c927e7db2dcc703c0e500b653ca82273b7bfad8045d85a471;"
